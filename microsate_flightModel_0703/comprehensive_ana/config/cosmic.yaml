package_mode_id: 0

# TimeCode 解包过滤（相对 2025-01-01 00:00:00 北京时间）；与画图无关
# 本数据 TimeCode 约 6.04e7–6.05e7，上限需大于该范围，否则解包 0 事例
time_code_min: 0
time_code_max: 1e12

# 画波形模式（CsI / Calo 共用，与 TriggerID 无关）:
#   range — 画 TimeCode 前八位落在 [draw_timecode_min, draw_timecode_max] 内的波形
#   list  — 只画 draw_time_code（可含小数，按毫秒匹配；整秒按前八位匹配）
wave_draw_mode: list

# range 模式：画图 TimeCode 区间（前八位秒；与解包 time_code_min/max 独立）
draw_timecode_min: 60644487
draw_timecode_max: 60645406

# list 模式：只画这些 TimeCode（可含小数，按毫秒匹配；整秒则按前八位匹配）
draw_time_code: [49156390.82, 49281714.21, 49279769.515, 49139395.764, 49236243.779, 49242366.233, 49333752.796, 49334161.398, 49346595.555, 49377966.514, 49451672.679, 49486248.725, 49582390.44, 49596932.34, 49598341.762, 49849410.854, 49853154.779, 49844391.594, 49908285.947]

# 波形纵轴：[y0-200, y0+wave_y_add]；y0=第0个采样点 ADC。常规 200；看全量程用 70000
wave_y_add: 200

# Calo Sig_hmh/Sig_hbh 与 CsI CellADC_4x2 MIP 共用（只影响画图）:
#   thermal — Calo 5000–30000，CsI 1000–14000
#   room    — Calo 4000–15000，CsI 1000–5000
hg_sig_plot_mode: room

# 总 TH1D + TGraph(星号)：只统计 yaml 选中的画图事例；过阈通道（连续 5 点）填首点位置（不取 max）
# 输出 -> *_CsI_first_cross5_all.png, *_CsI_first_cross5_vs_timecode.png
csi_first_cross_hist: true
